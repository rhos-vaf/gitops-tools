---
# Namespace for this ArgoCD instance
# Will be created as gitops-<ARGOCD_INSTANCE> (e.g., gitops-client1)
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-ARGOCD_INSTANCE
  labels:
    # Self-management: this namespace is managed by its own ArgoCD instance
    argocd.argoproj.io/managed-by: gitops-ARGOCD_INSTANCE
---
# ArgoCD Custom Resource - configures an isolated ArgoCD instance
# Template variable ARGOCD_INSTANCE is replaced by sed during deployment
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: gitops-ARGOCD_INSTANCE
  namespace: gitops-ARGOCD_INSTANCE
spec:
  # ============================================================================
  # ARGOCD SERVER - Web UI and API server
  # ============================================================================
  server:
    replicas: 1  # Single replica (increase for HA)
    route:
      enabled: true  # Create OpenShift route for web access
      tls:
        termination: reencrypt  # TLS between route and pod
        insecureEdgeTerminationPolicy: Redirect  # HTTP -> HTTPS redirect
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi
    insecure: false  # Require TLS
    # Admin user disabled - OpenShift OAuth is used instead
    # Uncomment extraArgs below to disable OAuth and use admin user
    # extraArgs:
    #   - --disable-auth

  # ============================================================================
  # APPLICATION CONTROLLER - Reconciles Applications and syncs to cluster
  # ============================================================================
  controller:
    replicas: 1  # Single replica (increase for HA)
    resources:
      limits:
        cpu: 2000m    # Higher CPU for processing many Applications
        memory: 2Gi   # Memory usage scales with number of Applications
      requests:
        cpu: 250m
        memory: 1Gi
    sharding:
      enabled: false  # Disable sharding (enable for >1000 Applications)

  # ============================================================================
  # REPO SERVER - Clones Git repos and generates manifests
  # ============================================================================
  repo:
    replicas: 1
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
    # Mount cluster CA bundle for accessing Git repos with private certificates
    volumeMounts:
    - mountPath: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
      name: cluster-root-ca-bundle
      subPath: ca-bundle.crt
    volumes:
    - configMap:
        name: cluster-root-ca-bundle  # Created by Makefile target
      name: cluster-root-ca-bundle

  # ============================================================================
  # REDIS - Caching layer for Application state
  # ============================================================================
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi

  # ============================================================================
  # AUTHENTICATION - OpenShift OAuth integration via Dex
  # ============================================================================
  sso:
    provider: dex
    dex:
      openShiftOAuth: true  # Use OpenShift users/groups for authentication
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi

  # ============================================================================
  # HIGH AVAILABILITY - Disabled for single-node/CRC environments
  # ============================================================================
  ha:
    enabled: false  # Set to true for production multi-node clusters

  # ============================================================================
  # RBAC CONFIGURATION - Controls who can access ArgoCD UI
  # ============================================================================
  rbac:
    defaultPolicy: 'role:readonly'  # Unauthenticated users get read-only
    policy: |
      # Grant admin role to OpenShift cluster-admins
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin

      # Grant admin role to specific OpenShift users (uncomment and add usernames)
      # g, <your-openshift-username>, role:admin
      # g, admin-user1, role:admin

      # Grant admin role to ALL authenticated OpenShift users
      # WARNING: Remove this line if you want to restrict access to specific users
      g, system:authenticated, role:admin
    scopes: '[groups]'  # Use OpenShift groups for RBAC

  # ============================================================================
  # RESOURCE CUSTOMIZATIONS - Custom health checks for CRDs
  # ============================================================================
  resourceCustomizations: |
    # Custom health check for ArgoCD Applications
    argoproj.io/Application:
      health.lua: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs

    # Health check for OpenStack Control Plane - checks Ready condition
    core.openstack.org/OpenStackControlPlane:
      health.lua: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Ready" and condition.status == "True" then
                hs.status = "Healthy"
                hs.message = "OpenStackControlPlane is ready"
                return hs
              end
              if condition.type == "Ready" and condition.status == "False" then
                hs.status = "Degraded"
                hs.message = condition.message
                return hs
              end
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for OpenStackControlPlane to be ready"
        return hs

    # Health check for Kubernetes Jobs - checks succeeded/failed status
    batch/v1/Job:
      health.lua: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.succeeded ~= nil and obj.status.succeeded > 0 then
            hs.status = "Healthy"
            hs.message = "Job completed successfully"
            return hs
          end
          if obj.status.failed ~= nil and obj.status.failed > 0 then
            hs.status = "Degraded"
            hs.message = "Job failed"
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Job is running"
        return hs

  # ============================================================================
  # RESOURCE EXCLUSIONS - Resources to ignore during sync
  # ============================================================================
  resourceExclusions: |
    # Exclude Tekton resources (they are ephemeral and shouldn't be managed by ArgoCD)
    - apiGroups:
      - tekton.dev
      clusters:
      - '*'
      kinds:
      - TaskRun      # Tekton pipeline task runs
      - PipelineRun  # Tekton pipeline runs

  # ============================================================================
  # APPLICATIONSET CONTROLLER - Manages ApplicationSets for multi-cluster apps
  # ============================================================================
  applicationSet:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

  # ============================================================================
  # NOTIFICATIONS CONTROLLER - Sends notifications about app sync status
  # ============================================================================
  notifications:
    enabled: false  # Disabled by default (enable for Slack/email notifications)

  # ============================================================================
  # STATUS BADGE - Enables /api/badge endpoint for status badges
  # ============================================================================
  statusBadgeEnabled: true

  # ============================================================================
  # PROMETHEUS MONITORING - Exposes metrics for Prometheus scraping
  # ============================================================================
  prometheus:
    enabled: true   # Enable metrics endpoint
    route:
      enabled: false  # Don't expose metrics via external route

  # ============================================================================
  # SOURCE NAMESPACES - Namespaces where ArgoCD Applications can be created
  # ============================================================================
  # Applications can only be created in these namespaces for security isolation
  # Use create_managed_namespace Makefile target to add more namespaces
  sourceNamespaces:
    - gitops-ARGOCD_INSTANCE  # Default: ArgoCD instance's own namespace
