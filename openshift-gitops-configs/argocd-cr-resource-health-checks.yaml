---
# ArgoCD CR Patch for Custom Resource Health Checks
#
# This patch adds custom health check Lua scripts to the ArgoCD Custom Resource.
# The operator will then propagate these to the argocd-cm ConfigMap automatically.
#
# NOTE: Uses resourceHealthChecks field (v0.8.0+), not the deprecated resourceCustomizations
# Each entry maps to resource.customizations.health.<group>_<kind> in argocd-cm
#
# Usage:
#   oc patch argocd openshift-gitops -n openshift-gitops --type merge --patch-file argocd-cr-resource-health-checks.yaml
#
spec:
  resourceHealthChecks:
    # BareMetalHost Health Check
    # A BareMetalHost is healthy when provisioning.state is "available" or "provisioned"
    - group: metal3.io
      kind: BareMetalHost
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.provisioning ~= nil and obj.status.provisioning.state ~= nil then
          if obj.status.provisioning.state == "available" or obj.status.provisioning.state == "provisioned" then
            hs.status = "Healthy"
            hs.message = "BareMetalHost is " .. obj.status.provisioning.state
            return hs
          end
        end
        hs.status = "Progressing"
        if obj.status ~= nil and obj.status.provisioning ~= nil and obj.status.provisioning.state ~= nil then
          hs.message = "BareMetalHost provisioning state: " .. obj.status.provisioning.state
        else
          hs.message = "BareMetalHost provisioning state unknown"
        end
        return hs

    # OpenStackControlPlane Health Check
    # A control plane is healthy when Ready condition is True
    - group: core.openstack.org
      kind: OpenStackControlPlane
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "False" then
              hs.status = "Progressing"
              hs.message = condition.message
              return hs
            end
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for OpenStackControlPlane setup completion."
        return hs

    # OpenStackDataPlaneNodeSet Health Check
    # A NodeSet is healthy when SetupReady condition is True
    - group: dataplane.openstack.org
      kind: OpenStackDataPlaneNodeSet
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "SetupReady" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "OpenStackDataPlaneNodeSet setup not ready"
        return hs

    # OpenStackDataPlaneDeployment Health Check
    # A deployment is healthy when Ready condition is True
    - group: dataplane.openstack.org
      kind: OpenStackDataPlaneDeployment
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "OpenStackDataPlaneDeployment not ready"
        return hs

    # NodeNetworkConfigurationPolicy Health Check
    # NNCP is healthy when Available condition is True
    - group: nmstate.io
      kind: NodeNetworkConfigurationPolicy
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Progressing" and condition.status == "True" then
              hs.status = "Progressing"
              hs.message = condition.message
              return hs
            end
            if condition.type == "Degraded" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = condition.message
              return hs
            end
            if condition.type == "Available" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for NNCP to be SuccessfullyConfigured"
        return hs

    # AnsibleTest Health Check (Test Operator)
    # An AnsibleTest is healthy when the Ready condition is True (test passed)
    - group: test.openstack.org
      kind: AnsibleTest
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "AnsibleTest is initializing"

        if obj.status ~= nil then
          -- Check if the test has finished (succeeded or failed)
          if obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              -- Ready condition indicates test completion
              if condition.type == "Ready" then
                if condition.status == "True" then
                  hs.status = "Healthy"
                  hs.message = "AnsibleTest completed successfully"
                  return hs
                elseif condition.status == "False" and condition.reason == "Failed" then
                  hs.status = "Degraded"
                  hs.message = "AnsibleTest failed: " .. (condition.message or "Unknown error")
                  return hs
                end
              end

              -- Error condition
              if condition.type == "Error" and condition.status == "True" then
                hs.status = "Degraded"
                hs.message = "AnsibleTest error: " .. (condition.message or "Unknown error")
                return hs
              end
            end
          end

          -- Check hash (indicates test is running)
          if obj.status.hash ~= nil and obj.status.hash ~= "" then
            hs.status = "Progressing"
            hs.message = "AnsibleTest is running (hash: " .. string.sub(obj.status.hash, 1, 8) .. ")"
            return hs
          end

          -- Check for workflow steps
          if obj.status.workflowTasks ~= nil then
            local totalSteps = 0
            local completedSteps = 0
            for i, task in ipairs(obj.status.workflowTasks) do
              totalSteps = totalSteps + 1
              if task.status == "Completed" then
                completedSteps = completedSteps + 1
              end
            end
            if totalSteps > 0 then
              hs.status = "Progressing"
              hs.message = string.format("AnsibleTest running: %d/%d steps completed", completedSteps, totalSteps)
              return hs
            end
          end
        end

        -- Default progressing state
        hs.status = "Progressing"
        hs.message = "Waiting for AnsibleTest to start"
        return hs

    # VaultStaticSecret Health Check (Vault Secrets Operator)
    # A VaultStaticSecret is healthy when the SecretSynced condition is True
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "SecretSynced" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "Secret synced from Vault"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Vault secret sync"
        return hs

    # VaultAuth Health Check
    # VaultAuth is healthy when status.valid is true
    - group: secrets.hashicorp.com
      kind: VaultAuth
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for VaultAuth to be Valid."
        if obj.status ~= nil then
          if obj.status.valid ~= nil then
            if obj.status.valid == true then
              hs.status = "Healthy"
              hs.message = "VaultAuth is valid"
            end
          end
        end
        return hs

    # VaultConnection Health Check
    # VaultConnection is healthy when status.valid is true
    - group: secrets.hashicorp.com
      kind: VaultConnection
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for VaultConnection to be Valid."
        if obj.status ~= nil then
          if obj.status.valid ~= nil then
            if obj.status.valid == true then
              hs.status = "Healthy"
              hs.message = "VaultConnection is valid"
            end
          end
        end
        return hs

    # OpenStackProvisionServer Health Check
    # Provision server is healthy when Ready condition is True
    - group: baremetal.openstack.org
      kind: OpenStackProvisionServer
      check: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = condition.message
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "OpenStackProvisionServer not ready"
        return hs

    # Subscription Health Check (OLM)
    # Subscription is healthy when state is AtLatestKnown or UpgradePending
    - group: operators.coreos.com
      kind: Subscription
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.state ~= nil then
            if obj.status.state == "AtLatestKnown" or obj.status.state == "UpgradePending" then
              hs.message = obj.status.state .. " - " .. obj.status.currentCSV
              hs.status = "Healthy"
            end
          end
        end
        return hs

    # ArgoCD Application Health Check
    # Application is healthy based on its own health.status
    - group: argoproj.io
      kind: Application
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Application status unknown"
        return hs

    # MachineConfig Health Check (OpenShift)
    # MachineConfig is always considered healthy once created
    # The actual rollout status is tracked by MachineConfigPool health check
    - group: machineconfiguration.openshift.io
      kind: MachineConfig
      check: |
        hs = {}
        if obj.metadata ~= nil and obj.metadata.name ~= nil then
          hs.status = "Healthy"
          hs.message = "MachineConfig created (rollout tracked by MachineConfigPool)"
          return hs
        end
        hs.status = "Progressing"
        hs.message = "MachineConfig not yet created"
        return hs

    # MachineConfigPool Health Check (OpenShift)
    # MachineConfigPool is healthy when all machines are updated, ready, and not degraded
    # Critical for ArgoCD wave ordering when MachineConfigs are applied
    - group: machineconfiguration.openshift.io
      kind: MachineConfigPool
      check: |
        hs = {}
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            -- Parse conditions
            local updated = false
            local updating = false
            local degraded = false

            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Updated" and condition.status == "True" then
                updated = true
              end
              if condition.type == "Updating" and condition.status == "True" then
                updating = true
              end
              if condition.type == "Degraded" and condition.status == "True" then
                degraded = true
              end
            end

            -- Parse machine counts
            local machineCount = obj.status.machineCount or 0
            local readyMachineCount = obj.status.readyMachineCount or 0
            local updatedMachineCount = obj.status.updatedMachineCount or 0
            local degradedMachineCount = obj.status.degradedMachineCount or 0

            -- Healthy: all machines updated, ready, and not degraded
            if updated and not updating and not degraded and
               machineCount == readyMachineCount and
               machineCount == updatedMachineCount and
               degradedMachineCount == 0 then
              hs.status = "Healthy"
              hs.message = "All " .. tostring(machineCount) .. " machines updated and ready"
              return hs
            end

            -- Degraded: pool or machines in error state
            if degraded or degradedMachineCount > 0 then
              hs.status = "Degraded"
              hs.message = "Pool degraded: " .. tostring(degradedMachineCount) .. "/" .. tostring(machineCount) .. " machines degraded"
              return hs
            end

            -- Progressing: actively updating
            if updating then
              hs.status = "Progressing"
              hs.message = "Updating: " .. tostring(readyMachineCount) .. "/" .. tostring(machineCount) .. " ready, " .. tostring(updatedMachineCount) .. "/" .. tostring(machineCount) .. " updated"
              return hs
            end

            -- Progressing: waiting for all machines to catch up
            if readyMachineCount < machineCount or updatedMachineCount < machineCount then
              hs.status = "Progressing"
              hs.message = "Rolling out: " .. tostring(readyMachineCount) .. "/" .. tostring(machineCount) .. " ready, " .. tostring(updatedMachineCount) .. "/" .. tostring(machineCount) .. " updated"
              return hs
            end
          end
        end

        -- Unknown: can't determine health
        hs.status = "Unknown"
        hs.message = "Unable to determine MachineConfigPool health"
        return hs
